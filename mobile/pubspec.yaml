name: secureguide_mobile
description: >-
  SecureGuide offline-first mobile client. It binds to the read-model-v1
  contract and stores catalog and profile data locally in SQLite.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  crypto: ^3.0.7
  file_picker: ^11.0.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.12.0
  printing: ^5.14.3
  sqflite: ^2.4.2+1
  sqlite3: ^3.5.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8
  sqflite_common_ffi: ^2.4.0+3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/catalog.db
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
