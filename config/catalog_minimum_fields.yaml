{
  "schema_version": 1,
  "contract_id": "secureguide-catalog-minimum-valid",
  "contract_version": "1.0.0",
  "result_names": {
    "minimum": "MINIMUM_CATALOG_VALIDATION",
    "strict": "STRICT_USACM_CONFORMANCE"
  },
  "lifecycle": ["RAW", "MINIMUM_VALID", "ENRICHED"],
  "core_required": [
    "id",
    "type",
    "title_en",
    "definition_short_en",
    "primary_domain",
    "sub_domain",
    "abstraction_level",
    "source",
    "source_type",
    "source_document",
    "obligation_level",
    "granularity_level",
    "classification_confidence",
    "classification_rationale",
    "publication_status",
    "is_active"
  ],
  "relational_required": ["artifact_source_lineage"],
  "type_required": {
    "ART-REQ": ["requirement_type"],
    "ART-CTR": ["control_nature", "control_function", "testability"],
    "ART-CTE": ["control_nature", "control_function", "testability"],
    "ART-AST": ["asset_type", "asset_criticality"],
    "ART-RSK": ["risk_remediation"],
    "ART-EXC": ["exception_approval_date", "exception_expiry_date"]
  },
  "conditional_required": [
    {
      "types": ["ART-POL", "ART-STD", "ART-PRC"],
      "when": {"publication_status": "PUBLISHED"},
      "fields": ["effective_date"]
    }
  ],
  "enrichment_only": [
    "title_ar",
    "description_ar",
    "canonical_statement",
    "definition_short_ar",
    "definition_full_en",
    "definition_full_ar",
    "objective_en",
    "objective_ar",
    "applicability_note",
    "implementation_guidance",
    "verification_method_note",
    "verification_method_note_ar",
    "evidence_required",
    "evidence_required_ar",
    "common_misinterpretations",
    "framework_mappings",
    "artifact_tags",
    "artifact_relationships",
    "artifact_platforms",
    "artifact_threats",
    "stakeholders",
    "cost",
    "maturity"
  ],
  "review_policy": {
    "human_review_required_for_minimum": false,
    "not_reviewed_allowed": true,
    "low_confidence_allowed": true,
    "low_confidence_threshold": 0.70,
    "low_confidence_requires": {
      "requires_human_review": 1,
      "ai_review_status": "AIR-HUMAN-REVIEW"
    },
    "default_uncertain_type": null,
    "indefensible_type_disposition": "DEFERRED"
  },
  "lineage_policy": {
    "minimum_rows_per_canonical": 1,
    "roles": ["SUPPORTS_CANONICAL", "SPLIT"],
    "mapping_strengths": ["DIRECT", "INDIRECT", "PARTIAL", "INFORMATIVE"],
    "non_direct_requires_rationale": true
  },
  "raw_dispositions": [
    "SUPPORTS_CANONICAL",
    "SPLIT",
    "DUPLICATE",
    "CROSSWALK_ONLY",
    "RELATION_ONLY",
    "REJECTED",
    "DEFERRED"
  ],
  "release_eligibility": {
    "publication_status": ["APPROVED", "PUBLISHED"],
    "is_active": 1
  }
}
